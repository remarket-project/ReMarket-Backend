services:
  # 🔴 PostgreSQL Database
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: remarket-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - remarket-network

  # 🟢 Redis Cache
  redis:
    image: redis:7-alpine
    container_name: remarket-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - remarket-network

  # 🟠 MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: remarket-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: minio server /data --console-address ":9001"
    networks:
      - remarket-network

  # 🤖 9Router - AI Gateway (Moderation)
  9router:
    image: decolua/9router:latest
    container_name: remarket-9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - nine_router_data:/app/data
    environment:
      PORT: 20128
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      NODE_ENV: production
      INITIAL_PASSWORD: ${NINE_ROUTER_PASSWORD:-123456}
    networks:
      - remarket-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20128/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🟡 pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: remarket-pgadmin
    profiles: ["tools"]
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@remarket.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    networks:
      - remarket-network
    depends_on:
      - db

  # �🟣 Backend FastAPI
  backend:
    build:
      context: ./ReMarket-Backend
      dockerfile: Dockerfile
    container_name: remarket-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ENVIRONMENT: ${ENVIRONMENT}
      SECRET_KEY: ${SECRET_KEY}
      API_V1_STR: ${API_V1_STR}
      PROJECT_NAME: ${PROJECT_NAME}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      BACKEND_HOST: ${BACKEND_HOST:-http://localhost:8000}
      # MinIO Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-listings}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # AI Moderation (9Router)
      NINE_ROUTER_BASE_URL: http://9router:20128/v1
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-true}
      # VNPay Payment
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
    volumes:
      - ./ReMarket-Backend:/app
    develop:
      watch:
        - action: sync
          path: ./ReMarket-Backend/app
          target: /app/app
          ignore:
            - .venv
        - action: rebuild
          path: ./ReMarket-Backend/pyproject.toml
    networks:
      - remarket-network
    command: bash -c "bash scripts/prestart.sh && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 🔵 Frontend React Vite
  frontend:
    build:
      context: ./ReMarket-Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    container_name: remarket-frontend
    profiles: ["frontend"]
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    volumes:
      - ./ReMarket-Frontend:/app
    develop:
      watch:
        - action: sync
          path: ./ReMarket-Frontend/src
          target: /app/src
        - action: rebuild
          path: ./ReMarket-Frontend/package.json
    networks:
      - remarket-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nine_router_data:

networks:
  remarket-network:
    driver: bridge
